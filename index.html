<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Papaguy</title>
</head>
<body>
  <main id="stage">
    <canvas id="bird" aria-label="Animated scarlet macaw"></canvas>
    <video id="camera" aria-label="Camera preview" muted playsinline hidden></video>
    <div id="controls">
      <p id="error" role="alert" hidden></p>
      <button id="connect" type="button" hidden>Start camera</button>
      <button id="show" type="button" disabled>Fullscreen</button>
    </div>
  </main>
</body>
</html>
